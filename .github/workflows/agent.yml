name: agent
on:
  push:
    branches: [main]
  pull_request:
jobs:
  invariants:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: FieldTick / ABI / live-feed invariants
        run: python -m agent.test_invariants
      - name: Arm / Torch language-arm invariants
        run: python -m unittest tests.test_agent_arm_invariants
      - name: Qwuack tenant invariants
        run: python -m unittest tests.test_qwuack_identity tests.test_qwuack_policy tests.test_qwuack_runtime tests.test_qwuack_boundary tests.test_qwuack_state tests.test_duck_gate tests.test_eink_sink
      - name: Qwuack SHARED_BODY perception and continuity
        run: python -m unittest tests.test_qwuack_shared_body
      - name: Field Intelligence v1
        run: python -m unittest tests.test_field_intelligence
      - name: Field Intelligence live path
        run: python -m unittest tests.test_field_intelligence_live_path
      - name: Startup --full path check
        run: python -m unittest tests.test_startup_full_paths
      - name: Language arm harness
        run: python -m agent.language.harness --steps 8
      - name: Language arm train runtime
        run: python -m agent.language.train --examples 48 --steps 40 --lr 1.5
      - name: Runtime artifact distribution
        run: python -m unittest tests.test_runtime_artifact_models tests.test_runtime_artifact_manifest tests.test_runtime_artifact_hashing tests.test_runtime_artifact_scanner tests.test_runtime_artifact_router tests.test_runtime_artifact_isolation tests.test_runtime_artifact_registry tests.test_runtime_artifact_promotion tests.test_runtime_artifact_service tests.test_runtime_artifact_integration tests.test_runtime_artifact_hardening tests.test_runtime_artifact_security tests.test_runtime_artifact_capabilities tests.test_runtime_artifact_fs tests.test_runtime_artifact_recovery
