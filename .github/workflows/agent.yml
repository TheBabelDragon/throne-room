name: agent
on:
  push:
    branches: [main]
  pull_request:
jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FieldTick / ABI / live-feed invariants
        run: python -m agent.test_invariants
