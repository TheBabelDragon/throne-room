[project]
name = "throne-room"
version = "0.5.0"
description = "Operational live Field Observer for real MetaField body measurements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
throne = "observer.live_view:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observer*"]
