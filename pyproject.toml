[project]
name = "throne-room"
version = "0.7.2"
description = "Operational Field Observer + agent-in-a-world loop for the MetaField stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "redis>=5.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
head-torch = ["torch>=2.0.0"]

[project.scripts]
throne = "observer.live_view:main"
throne-up = "observer.startup:main"
throne-torch = "visualization.torch_display:main"
throne-aurora = "aurora.action_layer:main"
throne-agent = "agent.chat:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["observer*", "visualization*", "aurora*", "agent*"]
